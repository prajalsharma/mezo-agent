# Render Blueprint - New > Blueprint > pick this repo.
#
# Runs on the FREE plan. Two things make that safe:
#
#   - Storage: free services have no persistent disk and are restarted often,
#     so the wallet store lives in Postgres (DATABASE_URL, e.g. a free Neon
#     database). The local file is only a cache; see src/db/remote.ts.
#   - Staying awake: free services sleep after 15 min without inbound HTTP.
#     Point a free cron pinger (cron-job.org / UptimeRobot) at /healthz every
#     5-10 min. Telegram polling is outbound, so it does not count as traffic.
#
# A web service, not a worker, so Render can health-check it: /healthz returns
# 503 when the bot stops polling Telegram, and Render restarts it.
services:
  - type: web
    name: mezo-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    numInstances: 1 # never more: two pollers on one token both break (409)
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATA_DIR
        value: /data # cache only; the durable copy is in Postgres
      - key: MEZO_NETWORK
        value: mainnet
      # Secrets and per-deployment values: set in the dashboard, never here.
      - key: DATABASE_URL # REQUIRED on the free plan, or wallets are lost on restart
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MASTER_ENCRYPTION_KEY
        sync: false
      - key: TELEGRAM_ALLOWED_USER_IDS
        sync: false
      - key: TELEGRAM_OPERATOR_USER_IDS
        sync: false
      - key: MEZO_RPC_URL
        sync: false
      - key: MEZO_ROUTER_ADDRESS
        sync: false
      - key: DELEGATE7702_ADDRESS
        sync: false
      - key: FEE_ROUTER_ADDRESS
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: AGENT_FEE_BPS
        sync: false
      - key: AGENT_TXN_FEE_BPS
        sync: false
      - key: AGENT_REFERRED_FEE_BPS
        sync: false
      - key: AGENT_REFERRAL_SHARE_PCT
        sync: false
      - key: AGENT_FEE_RECIPIENT
        sync: false
      - key: AGENT_AUTOMATION_NOTE
        sync: false
      - key: KEEPER_ENABLED
        sync: false
