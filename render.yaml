# Render Blueprint - New > Blueprint > pick this repo.
#
# A web service, not a background worker, only so Render can health-check it:
# /healthz returns 503 when the bot stops polling Telegram (src/core/health.ts),
# and Render restarts it. Workers get no health checks, so a hung-but-alive
# poller would stay down until someone noticed.
#
# Paid plan on purpose: free web services sleep after 15 min idle and cannot
# have a disk - the bot would go silent, and every restart would wipe every
# user's encrypted wallet.
services:
  - type: web
    name: mezo-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    numInstances: 1 # never more: two pollers on one token both break (409)
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: mezo-agent-data
      mountPath: /data # encrypted key store - must persist
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: MEZO_NETWORK
        value: mainnet
      # Secrets and per-deployment values: set in the dashboard, never here.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MASTER_ENCRYPTION_KEY
        sync: false
      - key: TELEGRAM_ALLOWED_USER_IDS
        sync: false
      - key: TELEGRAM_OPERATOR_USER_IDS
        sync: false
      - key: MEZO_RPC_URL
        sync: false
      - key: MEZO_ROUTER_ADDRESS
        sync: false
      - key: DELEGATE7702_ADDRESS
        sync: false
      - key: FEE_ROUTER_ADDRESS
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        sync: false
      - key: AGENT_FEE_BPS
        sync: false
      - key: AGENT_TXN_FEE_BPS
        sync: false
      - key: AGENT_REFERRED_FEE_BPS
        sync: false
      - key: AGENT_REFERRAL_SHARE_PCT
        sync: false
      - key: AGENT_FEE_RECIPIENT
        sync: false
      - key: AGENT_AUTOMATION_NOTE
        sync: false
      - key: KEEPER_ENABLED
        sync: false
