[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Mezo supports the full Cancun opcode set (and Prague/Osaka above it). The
# delegate uses no fork-specific opcodes; Cancun is a safe, broadly-compatible
# compilation target.
evm_version = "cancun"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
